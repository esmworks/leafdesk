services:
  leafdesk:
    image: ghcr.io/esmworks/leafdesk:0.9.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_URL: ${APP_URL}
      DATABASE_URL: postgres://leafdesk:${POSTGRES_PASSWORD}@db:5432/leafdesk
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      UPLOAD_DIR: /app/data/uploads
    expose:
      - 3000
    volumes:
      - leafdesk-uploads:/app/data/uploads

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leafdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: leafdesk
    volumes:
      - leafdesk-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leafdesk -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  leafdesk-uploads: {}
  leafdesk-db: {}
