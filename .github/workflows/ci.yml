name: CI

on:
  push:
    branches: [main]
    paths-ignore: [site/**, .github/workflows/pages.yml]
  pull_request:
    paths-ignore: [site/**, .github/workflows/pages.yml]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, tests, build and e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: leafdesk
          POSTGRES_PASSWORD: leafdesk
          POSTGRES_DB: leafdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leafdesk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Catches outgoing email so the auth e2e can follow reset links.
      mailpit:
        image: axllent/mailpit:v1.31.2
        ports:
          - 1025:1025
          - 8025:8025
      # A member's mailbox, read and sent from by the row mail e2e.
      greenmail:
        image: greenmail/standalone:2.1.14
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
        ports:
          - 3025:3025
          - 3143:3143
    env:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://leafdesk:leafdesk@localhost:5432/leafdesk
      BETTER_AUTH_SECRET: ci-only-secret-that-protects-nothing-000000000000
      NEXT_TELEMETRY_DISABLED: 1
      SMTP_URL: smtp://localhost:1025
      MAIL_FROM: Leafdesk CI <ci@leafdesk.test>
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Missing, extra or mismatched translation keys; the report lists what each language lacks.
      - name: Translations
        run: pnpm i18n:check
      - run: pnpm test
      - run: pnpm build
      # The JavaScript browsers download, gzipped; budgets are in the script.
      - name: Bundle budget
        run: pnpm tsx scripts/bundle-budget.ts
      - run: pnpm db:migrate

      - name: Page permissions end-to-end
        run: pnpm tsx scripts/access-e2e.ts

      - name: Database rows' access end-to-end
        run: pnpm tsx scripts/row-access-e2e.ts

      # Emails are captured by the script, never sent.
      - name: Access requests end-to-end
        run: pnpm tsx scripts/access-requests-e2e.ts

      - name: Database edits end-to-end
        run: pnpm tsx scripts/database-e2e.ts

      # A cell saved while its property's type changes, held at a known point by a second connection.
      - name: Type change with a concurrent edit end-to-end
        run: pnpm tsx scripts/type-change-race-e2e.ts

      - name: Database filters end-to-end
        run: pnpm tsx scripts/filters-e2e.ts

      # Assignment emails are captured by the script, never sent.
      - name: Person properties end-to-end
        run: pnpm tsx scripts/person-e2e.ts

      - name: People directory and analytics end-to-end
        run: pnpm tsx scripts/people-e2e.ts

      # Page mentions and [[Title]] links, the "Linked from" list and its unlinked mentions, the
      # search box's filters and the workspace graph, all against the database.
      - name: Mentions end-to-end
        run: pnpm tsx scripts/mentions-e2e.ts

      - name: Backlinks end-to-end
        run: pnpm tsx scripts/backlinks-e2e.ts

      # What a synced page shows each reader, its Markdown line over MCP, and published pages.
      - name: Synced pages end-to-end
        run: pnpm tsx scripts/synced-page-e2e.ts

      - name: Search filters end-to-end
        run: pnpm tsx scripts/search-e2e.ts

      - name: Graph end-to-end
        run: pnpm tsx scripts/graph-e2e.ts

      - name: Assigned rows end-to-end
        run: pnpm tsx scripts/assigned-e2e.ts

      # Uploads go to a temporary folder the script makes.
      - name: Markdown and vault import end-to-end
        run: pnpm tsx scripts/import-e2e.ts

      # A stand-in Google Drive MCP server on a random local port, started by the script.
      - name: Google Docs import end-to-end
        run: pnpm tsx scripts/google-docs-import-e2e.ts

      - name: Trash end-to-end
        run: pnpm tsx scripts/trash-e2e.ts

      - name: Trash and history retention end-to-end
        run: pnpm tsx scripts/retention-e2e.ts

      - name: Bulk row actions end-to-end
        run: pnpm tsx scripts/bulk-e2e.ts

      - name: Status, checklist and system properties end-to-end
        run: pnpm tsx scripts/property-types-e2e.ts

      - name: Grouping end-to-end
        run: pnpm tsx scripts/grouping-e2e.ts

      - name: Gallery, list and timeline views end-to-end
        run: pnpm tsx scripts/views-e2e.ts

      - name: Chart views end-to-end
        run: pnpm tsx scripts/chart-e2e.ts

      - name: Dashboards end-to-end
        run: pnpm tsx scripts/dashboard-e2e.ts

      - name: Form views end-to-end
        run: pnpm tsx scripts/form-e2e.ts

      - name: Formula and rollup end-to-end
        run: pnpm tsx scripts/formula-e2e.ts

      - name: Inline databases and linked views end-to-end
        run: pnpm tsx scripts/inline-db-e2e.ts

      - name: Publishing options end-to-end
        run: pnpm tsx scripts/publish-e2e.ts

      - name: Comments end-to-end
        run: pnpm tsx scripts/comments-e2e.ts

      # Emails are captured by the script, never sent.
      - name: Page watching end-to-end
        run: pnpm tsx scripts/page-watch-e2e.ts

      - name: Locked pages end-to-end
        run: pnpm tsx scripts/page-lock-e2e.ts

      - name: Archived pages end-to-end
        run: pnpm tsx scripts/page-archive-e2e.ts

      # Join request emails are captured by the script, never sent.
      - name: Membership policies end-to-end
        run: pnpm tsx scripts/membership-e2e.ts

      # Emails are dropped by the script, never sent.
      - name: Audit log end-to-end
        run: pnpm tsx scripts/audit-e2e.ts

      # Webhooks go to a server the script starts on 127.0.0.1; emails are captured, never sent.
      - name: Database automations end-to-end
        run: pnpm tsx scripts/automation-e2e.ts

      # Before the server starts: its automation worker would take the runs this script checks.
      - name: Buttons on pages end-to-end
        run: pnpm tsx scripts/button-e2e.ts

      # Before the server starts: its date check would take the runs this script checks.
      - name: Date-passed automations end-to-end
        run: pnpm tsx scripts/timed-automation-e2e.ts

      - name: Row activity end-to-end
        run: pnpm tsx scripts/row-activity-e2e.ts

      # Push messages go to a stand-in push service the script starts on 127.0.0.1, with VAPID keys
      # it makes itself.
      - name: Push notifications end-to-end
        run: pnpm tsx scripts/push-e2e.ts

      # Mail on database rows, read from and sent through the GreenMail service above.
      - name: Row email end-to-end
        run: pnpm tsx scripts/row-mail-e2e.ts
        env:
          MAIL_ALLOWED_HOSTS: 127.0.0.1

      # Follow-up sequences on rows: send window, daily limit, review, answers and out-of-office
      # replies, through the same GreenMail service.
      - name: Follow-ups end-to-end
        run: pnpm tsx scripts/follow-ups-e2e.ts
        env:
          GREENMAIL_SMTP_PORT: "3025"
          GREENMAIL_IMAP_PORT: "3143"

      # Jira syncs against a stand-in Jira Cloud the script starts on 127.0.0.1.
      - name: Jira sync end-to-end
        run: pnpm tsx scripts/jira-sync-e2e.ts

      # The service worker in headless Chrome (preinstalled on the runner), against a stand-in server
      # the script starts on 127.0.0.1. Ubuntu 24.04's AppArmor keeps Chrome's sandbox from making
      # user namespaces unless that restriction is lifted.
      - name: Service worker end-to-end
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          pnpm tsx scripts/sw-e2e.ts

      - name: Sub-items end-to-end
        run: pnpm tsx scripts/sub-items-e2e.ts

      - name: Dependencies end-to-end
        run: pnpm tsx scripts/dependencies-e2e.ts

      - name: File properties end-to-end
        run: pnpm tsx scripts/files-property-e2e.ts

      - name: Property access end-to-end
        run: pnpm tsx scripts/property-access-e2e.ts

      - name: Page backgrounds end-to-end
        run: pnpm tsx scripts/page-background-e2e.ts

      - name: Templates end-to-end
        run: pnpm tsx scripts/templates-e2e.ts

      - name: Small business template end-to-end
        run: pnpm tsx scripts/small-business-e2e.ts

      - name: Daily notes end-to-end
        run: pnpm tsx scripts/daily-notes-e2e.ts

      - name: Page history end-to-end
        run: pnpm tsx scripts/history-e2e.ts

      - name: Uploads end-to-end
        run: pnpm tsx scripts/uploads-e2e.ts

      - name: Notion import end-to-end
        run: pnpm tsx scripts/notion-import-e2e.ts

      - name: Markdown round trip end-to-end
        run: pnpm tsx scripts/roundtrip-e2e.ts

      - name: Groups end-to-end
        run: pnpm tsx scripts/groups-e2e.ts

      - name: Guests end-to-end
        run: pnpm tsx scripts/guests-e2e.ts

      - name: Teamspaces end-to-end
        run: pnpm tsx scripts/teamspaces-e2e.ts

      - name: Teamspace member access end-to-end
        run: pnpm tsx scripts/teamspace-member-access-e2e.ts

      - name: Presence end-to-end
        run: pnpm tsx scripts/presence-e2e.ts

      # Real websockets to a collab server the script starts itself.
      - name: Offline editing end-to-end
        run: pnpm tsx scripts/offline-e2e.ts

      # The model and embeddings are a fake OpenAI-compatible server the scripts start on 127.0.0.1.
      - name: AI writing assistant end-to-end
        run: pnpm tsx scripts/ai-e2e.ts

      - name: AI chat end-to-end
        run: pnpm tsx scripts/ai-chat-e2e.ts

      - name: AI chat comments, history, files, databases and forms end-to-end
        run: pnpm tsx scripts/ai-chat-tools-e2e.ts

      - name: AI chat memory end-to-end
        run: pnpm tsx scripts/ai-memory-e2e.ts

      # A fake Bot API and a fake model, both over HTTP: nothing reaches Telegram.
      - name: AI chat from Telegram end-to-end
        run: pnpm tsx scripts/telegram-e2e.ts

      - name: Skills end-to-end
        run: pnpm tsx scripts/skills-e2e.ts

      - name: AI and property access end-to-end
        run: pnpm tsx scripts/property-access-ai-e2e.ts

      - name: Semantic search end-to-end
        run: pnpm tsx scripts/semantic-search-e2e.ts

      - name: Voice notes over the REST API end-to-end
        run: pnpm tsx scripts/voice-api-e2e.ts

      # Before the server starts: its workers would take the runs and schedules these scripts check.
      - name: Agents end-to-end
        run: pnpm tsx scripts/agents-e2e.ts

      - name: Agents' skills end-to-end
        run: pnpm tsx scripts/agent-skills-e2e.ts

      - name: Agents' memory end-to-end
        run: pnpm tsx scripts/agent-memory-e2e.ts

      - name: Agents over the REST API end-to-end
        run: pnpm tsx scripts/agent-api-e2e.ts

      - name: Who answers an agent's call end-to-end
        run: pnpm tsx scripts/agent-approvers-e2e.ts

      - name: Apps that reach a workspace end-to-end
        run: pnpm tsx scripts/workspace-apps-e2e.ts

      - name: Repeating rows end-to-end
        run: pnpm tsx scripts/schedule-e2e.ts

      # A second Leafdesk on its own database (the script migrates it) as the remote MCP server.
      - name: Connections end-to-end
        run: |
          PGPASSWORD=leafdesk createdb -h localhost -U leafdesk leafdesk_peer
          pnpm tsx scripts/connector-e2e.ts

      # Restores into the second Leafdesk's database too (the connections e2e made it).
      - name: Workspace backups end-to-end
        run: pnpm tsx scripts/backup-e2e.ts

      # The admin e2e's administrator, and new workspaces for administrators only (the other policy
      # is checked against the database).
      - name: Start the server
        env:
          ADMIN_EMAILS: admin-e2e@example.test
          WORKSPACE_CREATION: admins
        run: |
          pnpm start > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 60); do
            curl -fs -o /dev/null http://localhost:3000/sign-in && exit 0
            sleep 1
          done
          echo "The server did not come up within 60 seconds."
          exit 1

      - name: Health endpoints end-to-end
        run: pnpm tsx scripts/health-e2e.ts

      - name: Create the e2e user
        run: |
          curl -fsS -o /dev/null http://localhost:3000/api/auth/sign-up/email \
            -H "Content-Type: application/json" -H "Origin: http://localhost:3000" \
            -d '{"name":"CI","email":"test@example.com","password":"password123"}'

      - name: MCP end-to-end
        run: pnpm tsx scripts/mcp-e2e.ts

      - name: Password reset end-to-end
        run: pnpm tsx scripts/auth-e2e.ts

      - name: REST API end-to-end
        run: pnpm tsx scripts/api-e2e.ts

      - name: Database columns end-to-end
        run: pnpm tsx scripts/columns-e2e.ts

      - name: Export end-to-end
        env:
          EXPORT_E2E_URL: http://localhost:3000
        run: pnpm tsx scripts/export-e2e.ts

      - name: Print view end-to-end
        env:
          PRINT_E2E_URL: http://localhost:3000
        run: pnpm tsx scripts/print-e2e.ts

      - name: Workspace site end-to-end
        run: pnpm tsx scripts/site-e2e.ts

      - name: SCIM end-to-end
        run: pnpm tsx scripts/scim-e2e.ts

      - name: Account security end-to-end
        run: pnpm tsx scripts/security-e2e.ts

      - name: Workspace security switches end-to-end
        run: pnpm tsx scripts/security-switches-e2e.ts

      - name: Approved networks end-to-end
        run: pnpm tsx scripts/ip-allowlist-e2e.ts

      - name: Two-step verification end-to-end
        run: pnpm tsx scripts/two-factor-e2e.ts

      # Last on this server: it signs every session out.
      - name: Instance administration end-to-end
        env:
          ADMIN_EMAILS: admin-e2e@example.test
          WORKSPACE_CREATION: admins
        run: pnpm tsx scripts/admin-e2e.ts

      # Again with the mock identity provider sso-e2e starts as the instance provider, and anyone
      # may create workspaces (account-e2e makes a second one).
      - name: Restart the server with single sign-on
        env:
          SSO_TRUSTED_ORIGINS: http://127.0.0.1:5199
          OIDC_ISSUER: http://127.0.0.1:5199/instance
          OIDC_CLIENT_ID: leafdesk-instance
          OIDC_CLIENT_SECRET: instance-secret
          OIDC_NAME: Mock IdP
          OIDC_DOMAINS: instance-sso.test
        run: |
          pkill -f server.ts
          for _ in $(seq 30); do
            curl -s -o /dev/null http://localhost:3000/ || break
            sleep 1
          done
          pnpm start >> "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 60); do
            curl -fs -o /dev/null http://localhost:3000/sign-in && exit 0
            sleep 1
          done
          echo "The server did not come up within 60 seconds."
          exit 1

      - name: Account settings end-to-end
        run: pnpm tsx scripts/account-e2e.ts

      - name: Single sign-on end-to-end
        run: pnpm tsx scripts/sso-e2e.ts

      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log" || true

  scale:
    name: Large workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: leafdesk
          POSTGRES_PASSWORD: leafdesk
          POSTGRES_DB: leafdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leafdesk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://leafdesk:leafdesk@localhost:5432/leafdesk
      BETTER_AUTH_SECRET: ci-only-secret-that-protects-nothing-000000000000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:migrate

      # 5,000 pages and a database of 50,000 rows, written through the app's own code.
      - name: Seed a large workspace
        run: pnpm tsx scripts/scale-seed.ts

      - name: Start the server
        run: |
          pnpm start > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 60); do
            curl -fs -o /dev/null http://localhost:3000/sign-in && exit 0
            sleep 1
          done
          echo "The server did not come up within 60 seconds."
          exit 1

      # Medians against the limits in the script; every timing is printed, over its limit or not.
      - name: Large workspace timings
        run: pnpm tsx scripts/scale-e2e.ts

      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log" || true

  upgrade:
    name: Upgrade from an older release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: leafdesk
          POSTGRES_PASSWORD: leafdesk
          POSTGRES_DB: leafdesk_upg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leafdesk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The release whose database this checkout upgrades.
      UPGRADE_FROM: v0.5.0
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://leafdesk:leafdesk@localhost:5432/leafdesk_upg
      FRESH_DATABASE_URL: postgres://leafdesk:leafdesk@localhost:5432/leafdesk_upg_fresh
      BETTER_AUTH_SECRET: ci-only-secret-that-protects-nothing-000000000000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      # All history and tags: the older release is unpacked from its tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      # The fresh install the upgraded schema is compared with, and the backups e2e's second
      # Leafdesk. No db:migrate: the upgrade test starts from empty databases and migrates them itself.
      - name: Databases
        run: |
          PGPASSWORD=leafdesk createdb -h localhost -U leafdesk leafdesk_upg_fresh
          PGPASSWORD=leafdesk createdb -h localhost -U leafdesk leafdesk_upg_peer

      # Installs the older release in $RUNNER_TEMP, fills the database through its code, upgrades it
      # with this checkout's migrations and checks it against what the older release read back.
      - name: Upgrade from the older release
        run: scripts/upgrade-test.sh "$UPGRADE_FROM"

      # End-to-end scripts on the upgraded database, next to the older release's workspace.
      - name: Database edits end-to-end
        run: pnpm tsx scripts/database-e2e.ts

      - name: Database filters end-to-end
        run: pnpm tsx scripts/filters-e2e.ts

      - name: Gallery, list and timeline views end-to-end
        run: pnpm tsx scripts/views-e2e.ts

      - name: Status, checklist and system properties end-to-end
        run: pnpm tsx scripts/property-types-e2e.ts

      - name: Formula and rollup end-to-end
        run: pnpm tsx scripts/formula-e2e.ts

      - name: Comments end-to-end
        run: pnpm tsx scripts/comments-e2e.ts

      - name: Page history end-to-end
        run: pnpm tsx scripts/history-e2e.ts

      - name: Trash end-to-end
        run: pnpm tsx scripts/trash-e2e.ts

      - name: Search filters end-to-end
        run: pnpm tsx scripts/search-e2e.ts

      - name: Mentions end-to-end
        run: pnpm tsx scripts/mentions-e2e.ts

      - name: Backlinks end-to-end
        run: pnpm tsx scripts/backlinks-e2e.ts

      # Webhooks go to a server the script starts on 127.0.0.1; emails are captured, never sent.
      - name: Database automations end-to-end
        run: pnpm tsx scripts/automation-e2e.ts

      - name: Templates end-to-end
        run: pnpm tsx scripts/templates-e2e.ts

      - name: Uploads end-to-end
        run: pnpm tsx scripts/uploads-e2e.ts

      - name: Markdown round trip end-to-end
        run: pnpm tsx scripts/roundtrip-e2e.ts

      - name: Page permissions end-to-end
        run: pnpm tsx scripts/access-e2e.ts

      - name: Teamspaces end-to-end
        run: pnpm tsx scripts/teamspaces-e2e.ts

      - name: Property access end-to-end
        run: pnpm tsx scripts/property-access-e2e.ts

      # Restores into leafdesk_upg_peer, made above.
      - name: Workspace backups end-to-end
        run: pnpm tsx scripts/backup-e2e.ts

  desktop:
    name: Desktop app on ${{ matrix.name }}
    # On each platform the app ships for: the local mode's tests start PostgreSQL and the Leafdesk
    # server for real, from the repository and then from the packaged app.
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 26, as in desktop.yml: its default Xcode compiles the app's icon.
          - name: macOS
            runner: macos-26
            platform: --mac --arm64
            resources: release/mac-arm64/Leafdesk.app/Contents/Resources
            executable: release/mac-arm64/Leafdesk.app/Contents/MacOS/Leafdesk
          - name: Windows
            runner: windows-2025
            platform: --win --x64
            resources: release/win-unpacked/resources
            executable: release/win-unpacked/Leafdesk.exe
          - name: Linux
            runner: ubuntu-24.04
            platform: --linux --x64
            resources: release/linux-unpacked/resources
            executable: release/linux-unpacked/leafdesk-desktop
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
          cache: true
          cache_dependency_path: |
            pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # The server local mode runs (src/local-server.test.ts starts it).
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm typecheck
      - run: pnpm test

      # The app as it ships, unsigned and not in an installer, with the built server and its PostgreSQL.
      - run: pnpm build
      - run: pnpm server
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          PLATFORM: ${{ matrix.platform }}
        run: pnpm exec electron-builder $PLATFORM --dir --publish never -c.mac.identity=null -c.mac.notarize=false
      - name: Local mode in the packaged app
        env:
          LEAFDESK_TEST_APP_RESOURCES: ${{ matrix.resources }}
          LEAFDESK_TEST_APP_EXECUTABLE: ${{ matrix.executable }}
        run: node --test src/local-server.test.ts

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max
