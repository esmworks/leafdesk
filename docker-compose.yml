services:
  # Makes what a first start needs, once, into the `secrets` volume: a random auth secret (unless
  # BETTER_AUTH_SECRET is set) and the bundled database's password (POSTGRES_PASSWORD when set,
  # random otherwise). A file that is there is never replaced. Back the volume up with the
  # database: a lost auth secret ends every sign-in and locks connections' sealed tokens.
  secrets:
    image: busybox:1.38.0
    restart: "no"
    environment:
      AUTH_SECRET_SET: ${BETTER_AUTH_SECRET:+yes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - secrets:/secrets
    command:
      - sh
      - -euc
      - |
        cd /secrets
        umask 077
        # Letters and digits only: the password goes into a URL.
        random() { tr -dc A-Za-z0-9 < /dev/urandom | head -c "$$1"; }
        if [ -z "$$AUTH_SECRET_SET" ] && [ ! -s auth-secret ]; then
          random 64 > auth-secret.new && mv auth-secret.new auth-secret
          echo "made a random auth secret"
        fi
        if [ ! -s postgres-password ]; then
          if [ -n "$$POSTGRES_PASSWORD" ]; then printf %s "$$POSTGRES_PASSWORD"; else random 48; fi > postgres-password.new
          mv postgres-password.new postgres-password
          echo "made the bundled database's password"
        fi
        # The app runs as node (uid 1000); the database as postgres (gid 70), which reads only its password.
        if [ -e auth-secret ]; then chown 1000:1000 auth-secret && chmod 0400 auth-secret; fi
        chown 1000:70 postgres-password && chmod 0440 postgres-password

  # Bundled PostgreSQL. To use an external database instead, set EXTERNAL_DATABASE_URL and
  # BUNDLED_DB=0 (see .env.example).
  db:
    image: postgres:18-alpine
    scale: ${BUNDLED_DB:-1}
    restart: unless-stopped
    depends_on:
      secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: leafdesk
      # Read only when the volume is first created; the app connects with the same file.
      POSTGRES_PASSWORD_FILE: /secrets/postgres-password
      POSTGRES_DB: leafdesk
    volumes:
      - pgdata:/var/lib/postgresql
      - secrets:/secrets:ro
    healthcheck:
      # Over TCP: while the volume is first set up, a temporary server answers on the socket only.
      test: ["CMD-SHELL", "pg_isready -U leafdesk -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Checked every second while it starts, so the app doesn't wait a whole interval.
      start_period: 30s
      start_interval: 1s

  app:
    # Prebuilt image from GitHub Container Registry; `docker compose up --build` builds from source instead.
    image: ghcr.io/esmworks/leafdesk:${LEAFDESK_VERSION:-latest}
    build: .
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      secrets:
        condition: service_completed_successfully
      db:
        condition: service_healthy
        required: false
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Not DATABASE_URL: in .env that one points at localhost for `pnpm dev`. Unset, the app
      # connects to the bundled database with POSTGRES_PASSWORD, or the password in `secrets`.
      DATABASE_URL: ${EXTERNAL_DATABASE_URL:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      # Unset, the random one in the `secrets` volume (src/lib/secret-files.ts).
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      LEAFDESK_SECRETS_DIR: /secrets
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-}
      # Server administrators beside the first account, and who may create workspaces (see .env.example).
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      WORKSPACE_CREATION: ${WORKSPACE_CREATION:-}
      # Single sign-on for the whole server: off unless issuer, client id and secret are set (see the README).
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-}
      OIDC_DOMAINS: ${OIDC_DOMAINS:-}
      SSO_TRUSTED_ORIGINS: ${SSO_TRUSTED_ORIGINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SOURCE_URL: ${SOURCE_URL:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Push notifications: off unless all three VAPID values are set (see the README).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      PUSH_ALLOWED_HOSTS: ${PUSH_ALLOWED_HOSTS:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Uploaded files: the `uploads` volume below unless S3_BUCKET points at S3-compatible storage.
      UPLOAD_DIR: /app/data/uploads
      UPLOAD_MAX_FILE_MB: ${UPLOAD_MAX_FILE_MB:-}
      UPLOAD_WORKSPACE_QUOTA_MB: ${UPLOAD_WORKSPACE_QUOTA_MB:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_PREFIX: ${S3_PREFIX:-}
      # People's own storage for workspaces' uploads: off unless OWN_STORAGE_ENABLED=true (see the README).
      OWN_STORAGE_ENABLED: ${OWN_STORAGE_ENABLED:-}
      STORAGE_ALLOWED_HOSTS: ${STORAGE_ALLOWED_HOSTS:-}
      STORAGE_GDRIVE_CLIENT_ID: ${STORAGE_GDRIVE_CLIENT_ID:-}
      STORAGE_GDRIVE_CLIENT_SECRET: ${STORAGE_GDRIVE_CLIENT_SECRET:-}
      STORAGE_DROPBOX_CLIENT_ID: ${STORAGE_DROPBOX_CLIENT_ID:-}
      STORAGE_DROPBOX_CLIENT_SECRET: ${STORAGE_DROPBOX_CLIENT_SECRET:-}
      EXPORT_MAX_PAGES: ${EXPORT_MAX_PAGES:-}
      EXPORT_MAX_FILES_MB: ${EXPORT_MAX_FILES_MB:-}
      # Requests per minute: per API token, and per user on /mcp (0 = no limit), and the origins
      # whose browser pages may call the REST API (see .env.example).
      API_RATE_LIMIT: ${API_RATE_LIMIT:-}
      MCP_RATE_LIMIT: ${MCP_RATE_LIMIT:-}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      # The server's time zone, for automations that set a date to "now" (UTC when unset).
      TZ: ${TZ:-}
      # Hosts on a private network that automation webhooks may reach (see the README).
      AUTOMATION_WEBHOOK_ALLOWED_HOSTS: ${AUTOMATION_WEBHOOK_ALLOWED_HOSTS:-}
      # How often "a date passes" automations look for rows, in seconds (600 when unset).
      AUTOMATION_DATE_CHECK_SECONDS: ${AUTOMATION_DATE_CHECK_SECONDS:-}
      # Connections: private hosts they may reach, and the key that seals their secrets (see the README).
      CONNECTOR_ALLOWED_HOSTS: ${CONNECTOR_ALLOWED_HOSTS:-}
      # Email on rows: mail servers on a private network that mailboxes may reach (see the README).
      MAIL_ALLOWED_HOSTS: ${MAIL_ALLOWED_HOSTS:-}
      LEAFDESK_ENCRYPTION_KEY: ${LEAFDESK_ENCRYPTION_KEY:-}
      LEAFDESK_ENCRYPTION_OLD_KEYS: ${LEAFDESK_ENCRYPTION_OLD_KEYS:-}
      # The instance's own OAuth apps for services that sign in only registered apps (see .env.example).
      CONNECTION_OAUTH_CLIENTS: ${CONNECTION_OAUTH_CLIENTS:-}
      # AI features stay off unless AI_PROVIDER and AI_MODEL are set (see the README's AI section).
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      AI_EMBEDDINGS_MODEL: ${AI_EMBEDDINGS_MODEL:-}
      AI_EMBEDDINGS_BASE_URL: ${AI_EMBEDDINGS_BASE_URL:-}
      AI_EMBEDDINGS_API_KEY: ${AI_EMBEDDINGS_API_KEY:-}
      AI_EMBEDDINGS_DIMENSIONS: ${AI_EMBEDDINGS_DIMENSIONS:-}
      AI_EMBEDDINGS_MIN_SIMILARITY: ${AI_EMBEDDINGS_MIN_SIMILARITY:-}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-}
      AI_RATE_LIMIT: ${AI_RATE_LIMIT:-}
      AI_WORKSPACE_RATE_LIMIT: ${AI_WORKSPACE_RATE_LIMIT:-}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-}
      AI_CONTEXT_WINDOW: ${AI_CONTEXT_WINDOW:-}
      # Voice notes stay off unless STT_PROVIDER and STT_MODEL are set (see .env.example).
      STT_PROVIDER: ${STT_PROVIDER:-}
      STT_MODEL: ${STT_MODEL:-}
      STT_BASE_URL: ${STT_BASE_URL:-}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MAX_SECONDS: ${STT_MAX_SECONDS:-}
      STT_MAX_MB: ${STT_MAX_MB:-}
      STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-}
      # People's own AI keys: off unless OWN_AI_KEYS_ENABLED=true (see the README).
      OWN_AI_KEYS_ENABLED: ${OWN_AI_KEYS_ENABLED:-}
      AI_ONLY_OWN_KEYS: ${AI_ONLY_OWN_KEYS:-}
      AI_ALLOWED_HOSTS: ${AI_ALLOWED_HOSTS:-}
      # Daily cleanup of the trash and old page history: on in production unless set to off.
      RETENTION_JOB: ${RETENTION_JOB:-}
    # Lets AI_BASE_URL=http://host.docker.internal:11434/v1 reach Ollama or LM Studio on the host (Linux too).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/data/uploads
      - secrets:/secrets:ro
    # Healthy once the app serves requests, reaches the database and has its migrations (see the
    # README). Replaces the image's own check, which asks only whether the server answers; nothing
    # here restarts on it, `docker compose ps` shows it. The image has node, not curl.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      # Migrations run before the server starts listening; checked every 2 seconds meanwhile.
      start_period: 60s
      start_interval: 2s
    ports:
      - "${PORT:-3000}:3000"

volumes:
  pgdata:
  uploads:
  secrets:
