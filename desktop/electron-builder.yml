# Packaging (electron-builder). Releases build in .github/workflows/desktop.yml, which sets the
# version from the release tag and uploads the files to that GitHub release; the apps update
# themselves from there (`publish`).
appId: io.github.esmworks.leafdesk
productName: Leafdesk
copyright: Copyright © esmworks
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - pages/**
  - build/icon.png
  - package.json
# Local mode's PostgreSQL (src/local-db.ts) runs from outside the archive: executables can't run
# from inside it.
asarUnpack:
  - node_modules/@embedded-postgres/**
# Puts the Leafdesk server local mode runs into the resources, and leaves only the app's own
# platform's PostgreSQL.
afterPack: scripts/after-pack.ts
artifactName: Leafdesk-${version}-${arch}.${ext}
# Electron's fuses, set in the packaged app's executable before it is signed: NODE_OPTIONS (and
# NODE_EXTRA_CA_CERTS) and --inspect are ignored, the app loads only from app.asar, checked against
# the hash electron-builder embeds (macOS and Windows), and cookies are encrypted on disk.
# ELECTRON_RUN_AS_NODE stays on: local mode runs its server, outside the archive, with the app's own
# Node (src/main.ts, startLocal); the server gets neither NODE_OPTIONS nor --inspect. Flipping them
# changes Electron's binaries, so a Mac app is signed ad hoc again right after (an unsigned build, as
# in CI, otherwise doesn't start on Apple silicon); a release is then signed as usual.
electronFuses:
  resetAdHocDarwinSignature: true
  runAsNode: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
# `leafdesk://` links bring a sign-in done in the system's browser back to the app (src/navigation.ts).
protocols:
  - name: Leafdesk
    schemes: [leafdesk]

mac:
  category: public.app-category.productivity
  # The macOS icon, made with Icon Composer: the system draws it in glass from a gradient tile and
  # the letters layer, and makes the .icns earlier macOS versions read from it. Compiling it takes
  # Xcode 26's actool. Windows and Linux keep build/icon.png.
  icon: build/icon.icon
  target:
    - target: dmg
      arch: [arm64, x64]
    # The zip is what an installed app downloads to update itself.
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signed with the Developer ID certificate in CSC_LINK, notarized with APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID (see .github/workflows/desktop.yml).
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: Leafdesk uses the microphone while you record a voice note.

# The disk image's window: the app and the Applications folder side by side, centred on the arrow
# drawn in build/background.png (its @2x for Retina; both made from build/background.svg). The
# window takes the picture's size, less the title bar.
dmg:
  iconSize: 96
  contents:
    - x: 140
      y: 150
      type: file
    - x: 400
      y: 150
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: Leafdesk-Setup-${version}.${ext}

linux:
  category: Office
  target:
    - target: AppImage
      arch: [x64, arm64]

publish:
  provider: github
  owner: esmworks
  repo: leafdesk
