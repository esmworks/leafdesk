# The desktop app is its own project with its own lockfile: this file keeps pnpm from treating it
# as part of the server's workspace one folder up.
allowBuilds:
  # Downloads the Electron binary for this platform.
  electron: true
  # Builds Squirrel installers for Windows; the app ships an NSIS installer instead.
  electron-winstaller: false
  # PostgreSQL for local mode: their script restores the symbolic links between its libraries.
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': true
  # Bundles the server's entry points (scripts/bundle-server.ts); its script checks its native binary.
  esbuild: true
# The Windows installer extracts the app straight into its folder (see the patch): extracting it to
# a temporary folder and copying it from there file by file made installing take up to an hour.
# Upgrading electron-builder needs the patch made again for its app-builder-lib (pnpm patch).
patchedDependencies:
  app-builder-lib@26.17.0: patches/app-builder-lib@26.17.0.patch
# Both processors' packages of this system: an app is built for each on the same machine (Linux's
# arm64 app on x64, scripts/after-pack.ts takes its PostgreSQL).
supportedArchitectures:
  os: [current]
  cpu: [x64, arm64]
