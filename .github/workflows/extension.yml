name: Browser extension

# Packs the browser extension (extension/) for every published release and adds the zip to that
# release, ready to load unpacked or to upload to the Chrome Web Store and Firefox Add-ons.
# Run it manually with a tag to pack the extension of an existing release again.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to pack, e.g. v0.6.5
        required: true

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: write

jobs:
  pack:
    name: Pack and add to the release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Pack
        working-directory: extension
        run: |
          version="${RELEASE_TAG#v}"
          jq --arg v "$version" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          zip -r "../leafdesk-extension-$version.zip" . -x '*.test.ts' '*.d.ts' 'README.md'
          echo "ZIP=leafdesk-extension-$version.zip" >> "$GITHUB_ENV"

      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"
