<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
    <meta name="color-scheme" content="light dark" />
    <title>Leafdesk</title>
    <link rel="stylesheet" href="tabs.css" />
  </head>
  <body>
    <nav class="strip">
      <div class="history">
        <button type="button" class="go" id="back" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" /></svg>
        </button>
        <button type="button" class="go" id="forward" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" /></svg>
        </button>
      </div>
      <div class="tabs" role="tablist"></div>
      <button type="button" class="new-tab" id="new-tab">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" /></svg>
      </button>
    </nav>
    <script src="../dist/pages/tabs.js"></script>
  </body>
</html>
