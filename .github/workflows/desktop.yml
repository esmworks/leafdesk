name: Desktop app

# Builds the desktop app (desktop/) for every published release and adds its installers to that
# release; installed apps update themselves from the latest release's latest*.yml files.
# Run it manually with a tag to (re)build the apps of an existing release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.6.3
        required: true

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build for ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon and Intel, signed with the Developer ID certificate and notarized. macOS 26:
          # its default Xcode compiles the app's icon (desktop/build/icon.icon).
          - name: macOS
            runner: macos-26
            platform: --mac
          # Not signed yet: Windows SmartScreen warns the first time it starts.
          - name: Windows
            runner: windows-2025
            platform: --win
          - name: Linux
            runner: ubuntu-24.04
            platform: --linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
          cache: true
          cache_dependency_path: |
            pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # The Leafdesk server the app runs in local mode, built from the repository's own packages.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm build
      - run: pnpm server

      # The same secrets as the other esmworks apps: the Developer ID certificate as a base64 .p12
      # and its password, and the Apple ID, app-specific password and team that notarize.
      - name: Signing keys
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_ID" ]; then
            echo "::error::Add the APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID secrets to sign and notarize the macOS app."
            exit 1
          fi

      - name: Package
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' }}
          PLATFORM: ${{ matrix.platform }}
        run: pnpm exec electron-builder "$PLATFORM" --publish never -c.extraMetadata.version="${RELEASE_TAG#v}"

      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/*.exe release/*.AppImage release/*.blockmap release/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::electron-builder made no installers."
            exit 1
          fi
          ls -l "${files[@]}"
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
