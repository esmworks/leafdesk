name: Dependencies

# Weekly, because new advisories arrive without a commit. Fails when `pnpm audit` finds a production
# dependency with an advisory that isn't reviewed in pnpm-workspace.yaml (auditConfig.ignoreGhsas),
# and lists outdated direct dependencies without failing.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [package.json, pnpm-lock.yaml, pnpm-workspace.yaml, .github/workflows/dependencies.yml]

permissions:
  contents: read

jobs:
  audit:
    name: Audit and outdated
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Advisories in production dependencies
        run: pnpm audit --prod

      - name: Outdated direct dependencies
        run: pnpm outdated || true
