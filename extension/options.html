<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="optionsTitle"></title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1><img src="icons/icon-48.png" alt="" width="28" height="28" /> <span data-i18n="optionsTitle"></span></h1>
      <form id="form" novalidate>
        <label for="address" data-i18n="optionsAddress"></label>
        <input id="address" name="address" type="url" inputmode="url" autocomplete="url" placeholder="https://leafdesk.example.com" required dir="ltr" />
        <p class="help" data-i18n="optionsHelp"></p>
        <div class="row">
          <button type="submit" data-i18n="optionsSave"></button>
          <p id="status" role="status" aria-live="polite"></p>
        </div>
      </form>
      <section>
        <h2 data-i18n="optionsHowTitle"></h2>
        <ul>
          <li data-i18n="optionsHowButton"></li>
          <li data-i18n="optionsHowMenu"></li>
          <li data-i18n="optionsHowSignIn"></li>
        </ul>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
